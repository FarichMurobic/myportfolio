<?xml version="1.0" encoding="UTF-8"?>
<svg
        width="800"
        height="800"
        viewBox="0 0 800 800"
        xmlns="http://www.w3.org/2000/svg"
>
    <style>
        :root {
        color: black;
        }

        .wave {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.15;
        opacity: 0.085;
        }

        .wave-fine {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.75;
        opacity: 0.045;
        }

        .wave-strong {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        opacity: 0.010;
        }

        .particle {
        fill: currentColor;
        opacity: 0.105;
        }

        .particle-soft {
        fill: currentColor;
        opacity: 0.038;
        }

        .particle-mid {
        fill: currentColor;
        opacity: 0.068;
        }

        .particle-bright {
        fill: currentColor;
        opacity: 0.145;
        }

        .vertical {
        stroke: currentColor;
        stroke-width: 0.4;
        opacity: 0.018;
        }

        /* =========================================
        SUBTLE PREMIUM MOTION
        ========================================= */

        .wave-main {
        transform-origin: center;
        animation: waveDrift 14s ease-in-out infinite;
        }

        .wave-secondary {
        transform-origin: center;
        animation: waveDriftReverse 18s ease-in-out infinite;
        }

        .wave-crossing {
        transform-origin: center;
        animation: crossingDrift 16s ease-in-out infinite;
        }

        .wave-horizon {
        animation: horizonDrift 20s ease-in-out infinite;
        }

        .particle-field {
        animation: fieldDrift 22s ease-in-out infinite;
        }

        .particle-field-secondary {
        animation: fieldDriftReverse 28s ease-in-out infinite;
        }

        .data-trails {
        animation: trailPulse 9s ease-in-out infinite;
        }

        @keyframes waveDrift {
        0%, 100% {
        transform: translate3d(-3px, 0px, 0);
        }
        50% {
        transform: translate3d(3px, 3px, 0);
        }
        }

        @keyframes waveDriftReverse {
        0%, 100% {
        transform: translate3d(2px, 1px, 0);
        }
        50% {
        transform: translate3d(-3px, -2px, 0);
        }
        }

        @keyframes crossingDrift {
        0%, 100% {
        transform: translate3d(-2px, 1px, 0);
        }
        50% {
        transform: translate3d(3px, -2px, 0);
        }
        }

        @keyframes horizonDrift {
        0%, 100% {
        transform: translate3d(0, 0, 0);
        opacity: 0.72;
        }
        50% {
        transform: translate3d(2px, -2px, 0);
        opacity: 1;
        }
        }

        @keyframes fieldDrift {
        0%, 100% {
        transform: translate3d(0, 0, 0);
        opacity: 0.9;
        }
        50% {
        transform: translate3d(3px, -4px, 0);
        opacity: 1;
        }
        }

        @keyframes fieldDriftReverse {
        0%, 100% {
        transform: translate3d(0, 0, 0);
        opacity: 0.8;
        }
        50% {
        transform: translate3d(-3px, 3px, 0);
        opacity: 1;
        }
        }

        @keyframes trailPulse {
        0%, 100% {
        opacity: 0.72;
        }
        50% {
        opacity: 1;
        }
        }

        @media (prefers-reduced-motion: reduce) {
        .wave-main,
        .wave-secondary,
        .wave-crossing,
        .wave-horizon,
        .particle-field,
        .particle-field-secondary,
        .data-trails {
        animation: none;
        }
        }

        @media (prefers-color-scheme: dark) {
        :root {
        color: white;
        }
        }

        @media (prefers-color-scheme: light) {
        :root {
        color: black;
        }
        }
    </style>


